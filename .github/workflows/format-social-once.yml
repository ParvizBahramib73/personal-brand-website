name: One-time social icon formatter
on:
  push:
    branches: [fix/social-icons-instagram-whatsapp]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/social-icons-instagram-whatsapp
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format icons
        run: npx prettier --write src/components/social-links.tsx
      - name: Commit generated formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/social-links.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to brand icon component"
            git push origin HEAD:fix/social-icons-instagram-whatsapp
          fi
