name: Format Mexican wave tests once

on:
  push:
    branches: [feat/mexican-wave-binary-background]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/mexican-wave-binary-background
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format wave tests
        run: npx prettier --write tests/binary-background.test.ts
      - name: Commit consistent code style
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/binary-background.test.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format Mexican wave tests"
            git push origin HEAD:feat/mexican-wave-binary-background
          fi
