name: One-time dependency lock and formatting

on:
  push:
    branches: [refactor/clean-architecture-quality-gates]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/clean-architecture-quality-gates
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and create package-lock.json
        run: npm install --no-audit --no-fund
      - name: Format source and configuration
        run: npm run format
      - name: Commit reproducible lockfile and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: pin dependencies and format source"
            git push origin HEAD:refactor/clean-architecture-quality-gates
          fi
