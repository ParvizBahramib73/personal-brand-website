name: Format binary canvas once

on:
  push:
    branches: [feat/binary-ambient-wave]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/binary-ambient-wave
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - name: Format canvas
        run: npx prettier --write src/components/binary-background.tsx
      - name: Commit consistent code style
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/binary-background.tsx
          if ! git diff --cached --quiet; then
            git commit -m "style: format ambient binary canvas"
            git push origin HEAD:feat/binary-ambient-wave
          fi
